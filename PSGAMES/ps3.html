
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TITLE -->
    <title>PS-Game</title>

    <!-- CSS -->
    <link rel="stylesheet" href="Games.css">

    <!-- ICON-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ARABIC FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- ARABIC FONT-->
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Beiruti:wght@200..900&display=swap" rel="stylesheet">

    <!-- ENGLISH FONT-->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>




<div class="games-page">

        <h1>العاب متاحة على بلايستيشن 3</h1>
        <div class="cards">


            <div class="card">
                <img src="images/Heavy Rain.jpg" alt="img">
                <div class="title">
                    <h3>Heavy Rain</h3>
                    <div class="buttons">
                        <button>Drama</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/god of war.jpg" alt="img">
                <div class="title">
                    <h3>God of War</h3>
                    <div class="buttons">
                        <button>17+</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/little big planet.jpg" alt="img">
                <div class="title">
                    <h3>Little Big Planet</h3>
                    <div class="buttons">
                        <button>Cartoon</button>
                        <button>Comic</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/red dead redemption.jpg" alt="img">
                <div class="title">
                    <h3>Red Dead Redemption</h3>
                    <div class="buttons">
                        <button>Adventure</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/batman.jpg" alt="img">
                <div class="title">
                    <h3>Batman</h3>
                    <div class="buttons">
                        <button>Adventure</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/Metal Gear.jpg" alt="img">
                <div class="title">
                    <h3>Metal Gear</h3>
                    <div class="buttons">
                        <button>Adventure</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/Gran Turismo.jpg" alt="img">
                <div class="title">
                    <h3>Gran Turismo</h3>
                    <div class="buttons">
                        <button>Drama</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/infamous.jpg" alt="img">
                <div class="title">
                    <h3>Infamous</h3>
                    <div class="buttons">
                        <button>SuperHero</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


        </div>

</div>


</body>
</html>
