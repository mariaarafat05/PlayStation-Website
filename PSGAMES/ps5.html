
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TITLE -->
    <title>PS-Game</title>

    <!-- CSS -->
    <link rel="stylesheet" href="Games.css">

    <!-- ICON-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ARABIC FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- ARABIC FONT-->
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Beiruti:wght@200..900&display=swap" rel="stylesheet">

    <!-- ENGLISH FONT-->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>




<div class="games-page">



    <h1>العاب متاحة على بلايستيشن  5</h1>
        <div class="cards">


            <div class="card">
                <img src="images/Stellar.jpg" alt="img">
                <div class="title">
                    <h3>Stellar Blade</h3>
                    <div class="buttons">
                        <button>Drama</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/elden ring.jpg" alt="img">
                <div class="title">
                    <h3>Elden Ring</h3>
                    <div class="buttons">
                        <button>17+</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/astro bot.jpg" alt="img">
                <div class="title">
                    <h3>Astro Bot</h3>
                    <div class="buttons">
                        <button>Cartoon</button>
                        <button>Comic</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/Demon's Souls.jpg" alt="img">
                <div class="title">
                    <h3>Demon's Souls</h3>
                    <div class="buttons">
                        <button>Adventure</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/Persona-5.jpg" alt="img">
                <div class="title">
                    <h3>Persona-5</h3>
                    <div class="buttons">
                        <button>Adventure</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/returnal.jpg" alt="img">
                <div class="title">
                    <h3>Returnal</h3>
                    <div class="buttons">
                        <button>Adventure</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/Ratchet & Clank.jpg" alt="img">
                <div class="title">
                    <h3>Ratchet & Clank</h3>
                    <div class="buttons">
                        <button>Drama</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


            <div class="card">
                <img src="images/alan wake.jpg" alt="img">
                <div class="title">
                    <h3>Alan Wake</h3>
                    <div class="buttons">
                        <button>SuperHero</button>
                        <button>Action</button>
                    </div>
                </div>
            </div>


        </div>



</div>

</html>
